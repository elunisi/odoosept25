[options]
# Database
db_host = postgres
db_port = 5432
db_user = odoo
db_password = odoo
db_name = False
db_template = template0
dbfilter = .*

# Development settings
workers = 0
max_cron_threads = 1
dev_mode = xml,reload,qweb,werkzeug,reload_on_update
auto_reload = True
proxy_mode = True

# Paths
addons_path = /opt/odoo/addons,/workspace/addons,/mnt/extra-addons
data_dir = /var/lib/odoo

# Logging
logfile = False
log_level = debug
log_db = False
log_handler = :DEBUG

# Server
interface = 0.0.0.0
port = 8069
longpolling_port = 8072

# Development performance
limit_time_cpu = 60
limit_time_real = 600
limit_memory_soft = 671088640
limit_memory_hard = 2147483648

# Security (development)
admin_passwd = dev_master_password
list_db = True

# Performance
osv_memory_count_limit = False
osv_memory_age_limit = False
